name: JobGo Landing CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "docker-compose.yml"
      - ".github/workflows/landing-ci.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mustang1056/jobgo/landing

jobs:
  build-and-push:
    name: Build and Push Landing
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mustang1056/jobgo/landing
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/jobgo/"
          strip_components: 0
          overwrite: true

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            echo "======================================"
            echo "       JOBGO LANDING DEPLOY"
            echo "======================================"

            mkdir -p /opt/jobgo

            cd /opt/jobgo

            echo "=== Login to GHCR ==="

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "=== Pull latest image ==="

            docker-compose pull landing

            echo "=== Start Landing ==="

            docker-compose up -d --remove-orphans landing

            echo "=== Cleanup ==="

            docker image prune -f

            echo "=== Status ==="

            docker-compose ps

            echo "======================================"
            echo "       DEPLOY COMPLETED"
            echo "======================================"

      - name: Check Landing logs
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /opt/jobgo

            echo "=== Landing logs ==="

            docker-compose logs --tail=30 landing || true

            echo "=== Status ==="

            docker-compose ps