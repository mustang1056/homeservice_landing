name: JobGo Landing CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mustang1056/jobgo/landing
  IMAGE_TAG: main
  CONTAINER_NAME: jobgo_landing
  HOST_PORT: 3010
  CONTAINER_PORT: 3000

jobs:
  build-and-push:
    name: Build and Push Landing
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy Landing to VPS
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:
      - name: Deploy Landing
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            echo "======================================"
            echo "       JOBGO LANDING DEPLOY"
            echo "======================================"

            IMAGE="ghcr.io/mustang1056/jobgo/landing:main"
            CONTAINER="jobgo_landing"

            echo ""
            echo "=== Docker version ==="
            docker --version

            echo ""
            echo "=== Docker Compose version ==="
            docker-compose --version || true

            echo ""
            echo "=== Login to GHCR ==="

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo ""
            echo "=== Pull JobGo Landing image ==="

            docker pull "$IMAGE"

            echo ""
            echo "=== Remove old JobGo container ==="

            docker rm -f jobgo_landing 2>/dev/null || true

            echo ""
            echo "=== Remove old HomeService Landing container ==="

            docker rm -f homeservice_landing 2>/dev/null || true

            echo ""
            echo "=== Start new JobGo Landing container ==="

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 3010:3000 \
              "$IMAGE"

            echo ""
            echo "=== Waiting for container ==="

            sleep 5

            echo ""
            echo "=== Container status ==="

            docker ps \
              --filter "name=$CONTAINER" \
              --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "=== Landing logs ==="

            docker logs --tail=50 "$CONTAINER"

            echo ""
            echo "=== HTTP check ==="

            if curl -f --max-time 10 http://127.0.0.1:3010/privacy; then
              echo ""
              echo "======================================"
              echo "     PRIVACY PAGE OK"
              echo "======================================"
            else
              echo ""
              echo "======================================"
              echo "     PRIVACY PAGE CHECK FAILED"
              echo "======================================"
              exit 1
            fi

            echo ""
            echo "=== Cleanup old Docker images ==="

            docker image prune -f

            echo ""
            echo "======================================"
            echo "       DEPLOY COMPLETED"
            echo "======================================"

      - name: Check Landing
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set +e

            echo "======================================"
            echo "       JOBGO LANDING STATUS"
            echo "======================================"

            echo ""
            echo "=== Containers ==="

            docker ps \
              --filter "name=jobgo_landing" \
              --filter "name=homeservice_landing" \
              --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "=== JobGo Landing logs ==="

            docker logs --tail=50 jobgo_landing 2>/dev/null || true

            echo ""
            echo "======================================"